[package]
name = "spectraform"
version = "0.1.0"
description = "Local-first audio-reactive visual engine"
edition = "2024"
rust-version = "1.99.1"

[lib]
name = "spectraform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spectraform"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }
